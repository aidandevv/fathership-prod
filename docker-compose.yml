version: "3.7"

services:
  db:
    image: postgres:14.8
    container_name: "postgres"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_USER: "${POSTGRES_DBUSER:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-fathership_development}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
